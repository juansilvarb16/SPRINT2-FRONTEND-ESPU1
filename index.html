<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escaneamento de Texto com Câmera UX na lente</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Escaneamento de Texto com Câmera UX na lente</h1>

<div id="telaBoasVindas">
  <h2>Seja bem-vindo! 👋</h2>
  <p>Aponte a câmera do seu celular para detectar e copiar textos automaticamente.</p>
  <button id="btnComecar">Começar</button>
</div>


<div id="telaScanner" style="display:none;">

  </div>

<div class="phone-container">


  <!-- Vídeo da câmera -->
  <video id="video" autoplay playsinline muted></video>

  <!-- Overlay de scanner -->
  <div class="scanner-ui">
    <div class="scan-frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="scan-line"></div>
    </div>
  </div>

  
  <img src="image-removebg-preview.png" class="phone-frame" alt="mockup celular">

</div>

<button id="capture">Capturar e Ler Texto</button>

<pre id="output">Texto detectado aparecerá aqui...</pre>

<div class="action-buttons" id="actionButtons">
  <button id="copyBtn">Copiar Texto</button>
  <button id="clearBtn" class="btn-secondary">Limpar</button>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="script.js"></script>

</body>
</html>
